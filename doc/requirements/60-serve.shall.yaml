      - id: T67.7
        title: GET /api/sets/{set}/items/{id}
        text: |
          One item with its children.

          ```json
          {
            "version": "dm7japskbab4.1",
            "id": "R3.1.1",
            "kind": "requirement",
            "title": "Lamp Seen From The Door",
            "text": "The machine SHALL show the refill lamp to anyone standing at the kitchen door.",
            "file": "requirements/01-tank.shall.yaml",
            "line": 17,
            "status": "implemented",
            "effectiveStatus": "implemented",
            "verify": "inspection"
          }
          ```

          A retired id is answered with 404, the error, and the entry that retired it:

          ```json
          {
            "error": "R4 was retired at requirements/01-tank.shall.yaml:27.",
            "retired": {
              "id": "R4",
              "title": "Water Handling",
              "file": "requirements/01-tank.shall.yaml",
              "line": 27
            }
          }
          ```
      - id: T67.8
        title: GET /api/sets/{set}/search?q={words}
        text: |
          What a reader typed names [R28]. A single word that names an item as an id
          comes first with `"match": "id"`: an id of the set, or `name/id` of
          another, where `name` is a name the manifest gives under `depends` or the
          name of a set the server serves, matched exactly first and then in
          capitals. Then come the items of the set whose id or title holds every
          word, with `"match": "title"`, and those whose text does, with `"match":
          "text"`, each group in reading order, ignoring case. At most 50 are listed,
          and `more` counts the rest.

          When nothing is found, `message` says why: that no item holds the words, or,
          for a word written as an id or as `name/id` and for a retired id, what the
          id names.

          ```json
          {
            "version": "dm7japskbab4.1",
            "query": "lamp",
            "results": [
              {
                "match": "title",
                "id": "R3.1",
                "state": "item",
                "set": "coffee",
                "title": "Refill Lamp",
                "file": "requirements/01-tank.shall.yaml"
              },
              {
                "match": "title",
                "id": "R3.1.1",
                "state": "item",
                "set": "coffee",
                "title": "Lamp Seen From The Door",
                "file": "requirements/01-tank.shall.yaml"
              }
            ]
          }
          ```

          ```json
          {
            "version": "dm7japskbab4.1",
            "query": "R4",
            "results": [],
            "message": "R4 was retired at requirements/01-tank.shall.yaml:27."
          }
          ```
      - id: T67.9
        title: GET /api/events
        text: |
          A stream of server-sent events. The server sends the current version as
          soon as the stream opens, and the new one each time the files change [R29]:

          ```text
          event: version
          data: dm7japskbab4.1
          ```

          A client that sees a version other than the one its answers carry fetches
          them again.
        links:
          - url: https://html.spec.whatwg.org/multipage/server-sent-events.html
            title: Server-sent events
      - id: T67.10
        title: The Dump
        text: |
          `shall dump [directory]` prints to standard output one JSON document
          with what the server would answer for every set under the directory
          [R74]:

          | Key | Holds |
          |---|---|
          | `sets` | Each set the server would serve, as its set answers it [T67.5], but with every file holding all its items, as the file answers it [T67.6] |
          | `clashes` | The names several sets share, each with their manifests; no set is dumped under such a name |
          | `findings` | The findings that belong to no set dumped |

          Nothing in a dump carries `version`, the version of the files a
          running server has read.
  - id: R36
    title: An API For Scripts And Agents
    text: The server SHALL offer everything its pages show of a set as JSON over HTTP.
    rationale: A script or an agent then reads a set as the page does, with its ids resolved,
      its statuses worked out and its findings placed, without parsing YAML or HTML.
    serves: [N55.1, N53.3]
    status: implemented
    children:
      - id: R36.1
        title: The Page Uses Only The API
        text: The page SHALL take everything it shows of a set from the API.
        rationale: The API then cannot fall behind what readers see.
        status: implemented
      - id: R36.2
        title: The API Described
        text: The repository's own set SHALL describe each resource of the API, with an example of
          its answer.
        rationale: A script's author then learns the API where the promises it keeps are read
          [T67].
        verify: inspection
        status: implemented
      - id: R36.3
        title: Reads Only
        text: The server SHALL NOT change any file.
        rationale: Reading a set then never alters it, whoever reads it and however.
        serves: [N62.1]
        verify: inspection
        status: implemented
  - id: T68
    title: A Static Copy
    text: |
      `shall export` writes what `shall serve` would show as files that any web
      host serves as they are [R60]:

      - every answer of the API [T67] that stays the same while the files do, each
        as a file named by its address with `.json` added: `api/sets.json`,
        `api/sets/{set}.json`, `api/sets/{set}/files/{path}.json` and
        `api/sets/{set}/items/{id}.json`, the last also for each retired id,
        holding the 404 answer the server would send;
      - the page at every address a reader can open: `index.html` for the start,
        `{set}/index.html` for each set and `{set}/{id}.html` for each item, and
        `404.html` for any other address, which a host such as GitHub Pages serves
        for the addresses it lacks.

      The answers' `version` is `copy`. Search and events have no files: the
      copy's page searches the copy's files as the server would [R60.1], reading
      `depends` in the set's answer for the names it gives other sets, and nothing
      changes while it is open [R60.4].

      A set's folders are named by its name as it is; a name that cannot name a
      folder, such as one holding `/`, fails the export. An id has a file when it
      names an item or is retired itself. The server also answers an id retired
      only with an ancestor, or written with another letter at a retired path; in
      a copy such an id has no file, and the page says no item has it.

      `-base` is the path the host serves the copy under, `/` by default [R60.2].
      GitHub Pages serves a project's site under `/{repository}/`, where this
      repository publishes its own set [R61]. A static host sends no headers of the
      copy's choosing, so the page carries its policy in a meta tag, which cannot
      keep it out of frames.
  - id: R60
    title: A Static Copy
    text: When asked to export, the tool SHALL write a copy of the pages it would serve for the
      sets under the given directory, the current one by default, as files that any web host
      serves as they are.
    rationale: A reader then opens a set from a link, such as one in a README to a site on
      GitHub Pages, without installing shall or running a server. Every answer the page reads
      but a search's is fixed for one version of the files, so the copy holds each as a file.
      Running the server's Go in the page, compiled to WebAssembly, was not taken; the page's
      policy would have to let WebAssembly run, and a reader would load about 2 MB before the
      first page.
    serves: [N53.3]
    status: implemented
    children:
      - id: R60.1
        title: Searched In The Page
        text: The copy's page SHALL find what the reader enters as the server's search would,
          from the copy's files.
        rationale: A static host runs nothing, and the copy already holds every item's id, title
          and text.
        status: implemented
      - id: R60.2
        title: Served Under A Path
        text: Where its command line gives a path, the tool SHALL write a copy that works served
          under that path, such as /shall/ for a GitHub project's site.
        status: implemented
      - id: R60.3
        title: Nothing Overwritten
        text: If the directory to write into holds anything, then the tool SHALL write nothing and
          say so.
        rationale: A mistyped directory then costs nothing, and the tool never has to delete.
        status: implemented
      - id: R60.4
        title: Still While Open
        text: The copy's page SHALL show the files as they stood when the copy was written.
        rationale: A static host has no stream of changes to send; a new copy shows new files.
        status: implemented
  - id: R74
    title: A Dump For Scripts
    text: When asked to dump, the tool SHALL print to standard output one JSON document holding
      every set under the given directory, the current one by default, each with every file and
      item as the server answers them.
    rationale: A script or an agent then reads everything a set says, with ids resolved, statuses
      worked out and findings placed, from one command and without a server [O49]. Built from
      the server's answers, the dump cannot disagree with the page.
    serves: [N55.1]
    status: implemented
