---
title: Serve
items:
  - id: T66
    title: The Document
    text: |
      `shall serve` shows each set under its directory as one document in the
      browser [R26], at the address it prints when it starts [R25.3]. Its start
      page lists the sets, each with its requirements by status [R25.4], [R25.6].

      A set's document reads the mission file first, then its chapters in path
      order. A chapter stays folded until the reader opens it or goes to an item in
      it [R26.4], [R26.6], and an outline beside the document leads to each
      chapter and item [R26.11]. An item shows its statement first; its rationale,
      notes and the items that name it wait in one fold area [R26.13]. A topic's
      Markdown is laid out as it reads, its diagrams drawn [R26.16].

      - Every id is a link, with a preview of what it names [R27], [R27.1].
      - The find box goes to an id, or lists the items that hold the words typed
        [R28].
      - The status filter shows only the requirements at the statuses chosen
        [R26.15].
      - The checker's findings sit on the items they concern [R30].
      - The page follows the files as they are saved [R29].
      - The reader switches between black on white and white on black [R34].

      Every view has an address [R26.2]: `/{set}/` for a set's document and
      `/{set}/{id}` for an item in it [R26.7], [R27.3], with the folds and the
      filter in its query.
  - id: R25
    title: Serves The Sets Under A Directory
    text: When started, the server SHALL serve every set whose manifest lies under the given
      directory, the current one by default.
    rationale: The sets a reader browses are then the ones the checker checks.
    serves: [N53.3]
    status: implemented
    children:
      - id: R25.1
        title: Address From The Command Line
        text: Where its command line gives an address and port, the server SHALL listen on them.
        status: implemented
      - id: R25.2
        title: Local By Default
        text: Where its command line gives no address, the server SHALL accept connections only
          from the machine it runs on.
        rationale: Serving a repository to the network is then a choice someone makes, not a
          default they inherit.
        status: implemented
        children:
          - id: R25.2.1
            title: Local Means Local
            text: While it accepts connections only from the machine it runs on, the server SHALL
              refuse every request whose Host header names neither localhost nor a loopback
              address.
            rationale: A web page in the reader's browser could otherwise reach the server through
              a domain it controls, by DNS rebinding. A server given a network address can be
              reached from that network anyway, so the check would add nothing there.
            serves: [R7]
            status: implemented
          - id: R25.2.2
            title: The Default Address
            text: Where its command line gives no address, the server SHALL listen on port 7180 of
              127.0.0.1.
            rationale: A bookmark or a script then finds the server where it was the last time.
            status: implemented
      - id: R25.3
        title: Says Where It Serves
        text: When started, the server SHALL print the address it serves on.
        status: implemented
      - id: R25.4
        title: Sets Listed
        text: The server SHALL list the sets it serves by name on its start page, each as a link
          to its document.
        status: implemented
      - id: R25.5
        title: Clashing Names
        text: If two sets it serves share a name, then the server SHALL list that name with an
          error naming both manifests, and serve neither under it.
        rationale: Keeping set names unique is up to the sets' authors. The server cannot tell
          which of the two an address means, so it points out the clash.
        status: implemented
      - id: R25.6
        title: Sets Compared
        text: The server SHALL show on its start page, for each set, how many of its
          requirements stand at each effective status [T63.10].
        rationale: A department manager then compares the sets of several products at a
          glance, in the same terms for each.
        serves: [N56.1]
        status: implemented
  - id: R26
    title: One Document Per Set
    text: The server SHALL show each set as one document, its mission file first and then its
      chapters [T63.2], each item in the order its file holds it and each child under its
      parent.
    serves: [N53.3]
    status: implemented
    children:
      - id: R26.1
        title: Statements Shown
        text: The server SHALL show each item of the mission file and of an unfolded chapter with
          its id, title and text.
        status: implemented
      - id: R26.2
        title: Views Are Links
        text: The server SHALL keep each choice the reader makes about the view in the page
          address, except the colour scheme, so that opening the address again shows the same
          view.
        rationale: A link then opens the view its sender saw. The colour scheme stays with each
          reader instead, so that a link does not impose the sender's on whoever opens it.
        status: implemented
      - id: R26.3
        title: Statuses Shown
        text: The server SHALL show the status of each need and the effective status [T63.10] of
          each requirement, with a requirement's written status beside it where the two differ.
        status: implemented
      - id: R26.4
        title: Chapters Folded
        text: The server SHALL show each chapter folded, as its title and the number of its items
          and findings, until it is unfolded.
        rationale: A set of thousands of requirements then opens as quickly as a small one, and
          the folded document doubles as its outline.
        status: implemented
      - id: R26.5
        title: Loaded When Unfolded
        text: While a chapter is folded, the server SHALL NOT send the chapter to the page.
        rationale: A single item still comes on its own wherever the page needs it, such as in a
          preview, a backlink or a search result.
        serves: [R26.4]
        status: implemented
      - id: R26.6
        title: Unfolded To Reach An Item
        text: When a link, an item's address, a jump or an outline entry leads to a folded
          chapter or to an item in one, the server SHALL unfold that chapter.
        status: implemented
      - id: R26.7
        title: A Set's Address
        text: The server SHALL give each set's document an address made of the set's name.
        rationale: Ids are unique only within a set, so every address names the set it belongs
          to.
        status: implemented
      - id: R26.8
        title: Broken Files In Place
        text: If a file of a set cannot be read or parsed as YAML, then the server SHALL show the
          rest of the set, with that file in its place as its file name and its findings.
        rationale: The page shows what is on disk, even halfway through an edit, and the rest of
          the set stays readable. Showing the last version that parsed was not taken because the
          page would then show what no file holds.
        serves: [N53.3, N52.5]
        status: implemented
      - id: R26.9
        title: Chapters In Path Order
        text: The server SHALL show a set's chapters in the order of their file paths.
        rationale: Authors then choose the order by how they name the files, with no list to keep
          in step with them.
        status: implemented
      - id: R26.10
        title: Mission First
        text: The server SHALL show a set's mission statement before its items.
        status: implemented
      - id: R26.11
        title: Outline
        text: The server SHALL show beside each document an outline of its chapters, each entry
          a link to its place.
        rationale: A reader of a large set then moves between its parts in one step.
        status: implemented
        children:
          - id: R26.11.1
            title: Unfolded Chapters Outlined
            text: While a chapter is unfolded, the server SHALL list its top-level items under it
              in the outline, and none of their children, whatever their kind.
            rationale: The outline then lists what the page holds and no more, so a folded
              chapter still sends none of its items.
            status: implemented
          - id: R26.11.2
            title: Where The Reader Is
            text: The server SHALL mark in the outline the chapter at the top of the screen, and
              the part of it the reader is in.
            status: implemented
          - id: R26.11.3
            title: Outline On Narrow Screens
            text: While the screen is narrower than 60em, the server SHALL keep the outline folded
              behind a button.
            rationale: The document then keeps the width of a phone or a narrow window.
            status: implemented
      - id: R26.12
        title: Unfolded When Reached
        text: When a folded chapter's heading comes into view, the server SHALL unfold that
          chapter, unless the reader folded it.
        rationale: A long set then loads as the reader reaches it, one chapter at a time, and a
          small one opens whole. Such an unfolding is no choice of the reader's, so it stays out
          of the page address, which scrolling makes up for; folding a chapter is one, and the
          address keeps it.
        status: implemented
      - id: R26.13
        title: One Fold Area
        text: The server SHALL put an item's backlinks, and a requirement's rationale and notes,
          in one area at the item's end, folded until the reader unfolds it.
        rationale: The statement then reads first, with what surrounds it one step away.
        status: implemented
      - id: R26.14
        title: Outside Links In A New Tab
        text: When the reader follows a link that leads outside the server, the server SHALL open
          it in a new tab.
        rationale: The document then stays where the reader left it.
        status: implemented
      - id: R26.15
        title: Filtered By Status
        text: While the reader has chosen effective statuses [T63.10], the server SHALL show of the
          requirements only those at a chosen status, and their parents as context.
        rationale: An implementer then sees what is still in draft or not yet verified without
          reading every chapter. Chapters with no requirement at a chosen status stay folded.
        status: implemented
        children:
          - id: R26.15.1
            title: The Filter Gives Way
            text: When the reader goes to an item that the filter hides, the server SHALL drop
              the filter.
            rationale: A link or a search result then always reaches its item.
            status: implemented
      - id: R26.16
        title: Topics Drawn
        text: The server SHALL show a topic's text [T63.11] laid out as its Markdown reads, each
          image as a link to it and each diagram drawn.
        rationale: The page then loads nothing from outside the server.
        serves: [N53.4]
        status: implemented
      - id: R26.17
        title: Progress Per Topic
        text: The server SHALL show beside each topic how many of the requirements below it stand
          at each effective status.
        rationale: A topic has no status of its own. The count tells how far its part of the set
          has got, where the lowest status alone would make one draft among many verified
          requirements read as the whole.
        status: implemented
      - id: R26.18
        title: Kinds Named
        text: The server SHALL show beside the title of each item the kind of item it is.
        rationale: A reader who reaches an item by a link then knows whether it is a result, a
          role, a need, a promise or an explanation without knowing the letters [T63].
        serves: [N53.4]
        status: implemented
      - id: R26.19
        title: Ranking Shown
        text: The server SHALL show beside each objective the ranking lists its place in the
          ranking.
        rationale: The ranking settles which objective wins when two conflict [T63.2], which a
          reader weighing a need or a requirement wants to see where the objective is.
        serves: [N53.4]
        status: implemented
  - id: R27
    title: Ids Are Links
    text: The server SHALL show every id that a field names or a text cites [T63.12], and that
      names an item the server serves, as a link to that item.
    serves: [N53.3]
    status: implemented
    children:
      - id: R27.1
        title: Preview On Hover Or Focus
        text: When the reader points at a link to an item or moves keyboard focus to it, the
          server SHALL show that item's title and text beside it.
        rationale: Previews let a reader follow a reference without losing their place.
        status: implemented
      - id: R27.2
        title: Backlinks In Short
        text: The server SHALL show on each item the ids of the items that name or cite it, each
          once, in reading order.
        status: implemented
        children:
          - id: R27.2.1
            title: Backlinks Unfolded
            text: When the reader unfolds an item's fold area, the server SHALL show there each
              item that names it with its title.
            rationale: Their texts stay out, since each id previews its text on hover or focus.
            status: implemented
      - id: R27.3
        title: Every Item Has An Address
        text: The server SHALL give each item an address, made of its set's address and its id,
          that opens the document at that item.
        status: implemented
      - id: R27.4
        title: Unknown Ids As Text
        text: If a field names or a text cites an id that is neither an item nor retired in a set
          the server serves, then the server SHALL show that id as plain text.
        rationale: A link must lead somewhere. The checker's finding on the item says what is
          wrong.
        status: implemented
      - id: R27.5
        title: Retired Ids Marked
        text: If a field names or a text cites a retired id [T63.4], then the server SHALL show that
          id as plain text, marked retired, with the title it was retired under.
        status: implemented
      - id: R27.6
        title: Titles Beside Ids
        text: The server SHALL show the title of each item that serves, stakeholders or mirrors
          names beside its id.
        rationale: A reader then sees what an item serves without pointing at each id, which a
          phone cannot do. The titles are grey, so that the statement stays the text to read.
        serves: [N53.3, N54.1]
        status: implemented
  - id: R28
    title: Jump To An Id
    text: When the reader enters an id, the server SHALL show the document at that item, in the
      current set unless the id names another set.
    serves: [N53.3]
    status: implemented
    children:
      - id: R28.1
        title: Jump To No Item
        text: If the reader enters an id that is neither an item nor retired in a set the server
          serves, then the server SHALL keep the document where it is and say that no item has
          that id.
        status: implemented
      - id: R28.2
        title: Jump To A Retired Id
        text: If the reader enters a retired id, then the server SHALL keep the document where it
          is and say the file and line where the id was retired.
        status: implemented
      - id: R28.3
        title: Found By Words
        text: When the reader enters words, the server SHALL list the items whose id, title or
          text holds every one of them, those matching by id first, then by title, then by text.
        rationale: A reader often knows what a requirement says before its id, and [O46] measures
          the time to find one by its text.
        status: implemented
  - id: R29
    title: Follows The Files
    text: When a set's file changes on disk, the server SHALL show the set as its files then
      stand within two seconds, without the reader reloading the page.
    rationale: An author edits in their editor and reads in the browser, and the two stay in
      step.
    serves: [N52.5]
    status: implemented
    children:
      - id: R29.1
        title: Any Number Of Tabs
        text: The server SHALL keep each visible page following the files, however many tabs are
          open.
        rationale: Browsers open only six connections to one server over plain HTTP, and each
          page following the files holds one open.
        status: implemented
      - id: R29.2
        title: Place Kept
        text: When a page follows a change, the server SHALL keep the item at the top of the
          screen there, or the item after it if that one was removed.
        rationale: A reader keeps their place while an author saves beside them.
        status: implemented
  - id: R30
    title: Findings In Place
    text: The server SHALL show each finding that the checker reports for the set on the item it
      concerns, with its severity.
    rationale: The page and the checker then cannot disagree.
    serves: [N53.3, N52.5]
    status: implemented
    children:
      - id: R30.1
        title: Findings Without An Item
        text: The server SHALL show each finding that concerns no item at the head of the file it
          concerns, or at the top of the document when it concerns no file of the set.
        status: implemented
  - id: R33
    title: Only What It Builds
    text: The server SHALL send only the answers it builds and the files embedded in its
      binary, never a file that a request names.
    rationale: A request then chooses among the files of the sets the server has read and
      reaches no other, however its path is written, without the server having to check paths.
    serves: [R7]
    status: implemented
  - id: R34
    title: Black Or White
    text: The server SHALL let the reader switch its pages between black on white and white on
      black.
    serves: [N53.3]
    status: implemented
    children:
      - id: R34.1
        title: The System's Scheme First
        text: While the reader has not chosen a colour scheme, the server SHALL show the one the
          reader's system asks for.
        status: implemented
      - id: R34.2
        title: Kept By The Browser
        text: When the reader chooses a colour scheme, the server SHALL keep the choice in the
          browser's own storage, for every page it serves.
        rationale: The choice belongs to the reader, not to a set or a link, so no file and no
          address holds it.
        status: implemented
  - id: T67
    title: The API
    text: |
      `shall serve` answers in JSON over HTTP, and its page builds the document
      from the same answers [R36.1], so a script or an agent reads a set exactly as
      a reader sees it: ids resolved, statuses worked out, findings placed. It only
      reads [R36.3], and answers only on this machine unless given an address
      [R25.2].

      The examples are the answers for the fuller example set [T63.14], served
      from the directory that holds its `shall.yaml`.

      - Every answer is `application/json` and carries `version`, the version of
        the files it was built from. The version changes whenever a file of a set
        changes, and differs from one start of the server to the next.
      - A set, file or item that does not exist is answered with status 404 and
        `{"error": "…"}`, a sentence saying what is missing.
      - Fields keep the names the format gives them. What the server works out is
        named in camelCase: `effectiveStatus`, `namedBy`, `itemId`, `retiredWith`.
      - Paths are relative to the directory the server serves.

      | Resource | Answer |
      |---|---|
      | `GET /api/sets` | The sets served, with their error and warning counts and their requirements by status [T67.4] |
      | `GET /api/sets/{set}` | One set: its findings, its mission file with its items, and its chapters without theirs [T67.5] |
      | `GET /api/sets/{set}/files/{path}` | One file with its items [T67.6] |
      | `GET /api/sets/{set}/items/{id}` | One item with its children [T67.7] |
      | `GET /api/sets/{set}/search?q={words}` | The items an id or words name [T67.8] |
      | `GET /api/events` | A stream of versions, one each time the files change [T67.9] |
    children:
      - id: T67.1
        title: References
        text: |
          Every id an item names comes as a reference, which says what the id names:

          | `state` | Meaning | Also carries |
          |---|---|---|
          | `item` | An item of a set the server serves | `set`, `title`, `file` |
          | `retired` | A retired id | `set`, `title` (the one it was retired under), `retiredWith` when an ancestor took it |
          | `unknown` | Nothing the server serves | — |
          | `mission` | The word `mission` in a need's `serves` | — |

          `id` is the id as written. Where it names an item of another set, written
          `name/id`, `set` is that set and `itemId` the item's id in it.
      - id: T67.2
        title: Items
        text: |
          An item carries `id`, `kind` (`objective`, `stakeholder`, `need`,
          `requirement` or `topic`), `title`, `text`, and the `file` and `line` it is
          written at, then the fields of its kind as written: `measure`,
          `stakeholders`, `serves`, `rationale`, `verify`, `status`, `notes`, `links`,
          `mirrors`, `retired`, with every id as a reference [T67.1]. Fields an item
          leaves out are left out. A topic's `text` is its Markdown as written.

          What the server works out:

          | Field | Meaning |
          |---|---|
          | `effectiveStatus` | A requirement's lowest status, counting the requirements below it, as [T63.10] defines it |
          | `namedBy` | The items that name or cite this one, each a reference with the `field` that names or cites it |
          | `cites` | Its prose fields that cite an id, `text`, `measure`, `rationale` and `notes` (one entry per note), and on the mission file `mission`, each as runs [T67.3] |
          | `findings` | The findings of `shall check` that concern this item |
          | `children` | The item's children, of every kind, in full |
          | `rank` | An objective's place in the mission's ranking, from 1, where the ranking lists it |
          | `requirements` | A topic's requirements, all below it, by effective status |
          | `blocks` | A topic's text read as Markdown [T67.3] |
      - id: T67.3
        title: Blocks And Runs
        text: |
          A topic's `blocks` are its text as blocks of text, each with a `type`:

          | `type` | Carries |
          |---|---|
          | `heading` | `level`, from 1, and `inline` |
          | `paragraph` | `inline` |
          | `list` | `ordered`, `start` when ordered, and `items`, each a list of blocks |
          | `quote` | `blocks` |
          | `code` | `language` as its fence names it, and `text` |
          | `diagram` | `language`, `mermaid` or `dot`, as the code block is marked, and `text`, its source; a `dot` diagram also carries `svg`, the server's drawing with only its shapes, text and styles, or `error`, why Graphviz cannot draw it |
          | `table` | `align` per column (`left`, `center`, `right` or none), `head`, a list of cells, and `rows`, each a list of cells; a cell is a list of `inline` |
          | `rule` | nothing more |
          | `html` | `text`, the HTML as written, to be shown as text |

          Within a block, `inline` is a list of runs, each with a `type`: `text` and
          `code` carry `text`; `emphasis` and `strong` carry `inline`; `link` carries
          `url`, `title` when it has one, and `inline`, an image coming as a link to
          it; `break` carries nothing; `ref`, an id the text cites, carries `ref`, a
          reference [T67.1]. HTML within a line comes as `text`. The `cites` of an
          item are runs too: `text` runs, and `ref` runs that carry a `ref`.
      - id: T67.4
        title: GET /api/sets
        text: |
          ```json
          {
            "version": "dm7japskbab4.1",
            "sets": [
              {
                "name": "coffee",
                "manifest": "shall.yaml",
                "errors": 0,
                "warnings": 0,
                "requirements": {
                  "total": 2,
                  "draft": 0,
                  "approved": 0,
                  "implemented": 2,
                  "verified": 0,
                  "waived": 0,
                  "other": 0
                }
              }
            ],
            "clashes": [],
            "findings": []
          }
          ```

          `requirements` counts each set's requirements, children included, by
          effective status; `other` counts those with no status or one the format
          does not define. `clashes` lists names that several sets share, each with
          their manifests; neither set is served under it [R25.5]. `findings` are
          those that belong to no set served under its name.
      - id: T67.5
        title: GET /api/sets/{set}
        text: |
          The set's files in the order they read: the mission file first, with its
          items, then the chapters in path order, each with its title, counts and the
          findings that concern the file itself, but not its items. `requirements`
          counts the set's requirements by effective status, as each file's `counts`
          does for the file. `findings` at the top are those that concern no file of
          the set, such as the manifest's. A file that cannot be read or parsed has
          `"broken": true` and its findings. `depends` gives, for each name the
          manifest's `depends` gives a set the server serves, that set's own name,
          such as `{"company": "acme-standards"}`; it is left out when there is
          none.

          ```json
          {
            "version": "dm7japskbab4.1",
            "name": "coffee",
            "manifest": "shall.yaml",
            "requirements": {
              "total": 2,
              "draft": 0,
              "approved": 0,
              "implemented": 2,
              "verified": 0,
              "waived": 0,
              "other": 0
            },
            "findings": [],
            "files": [
              {
                "path": "requirements/mission.shall.yaml",
                "kind": "mission",
                "title": "Why The Machine Exists",
                "counts": {
                  "items": 3,
                  "findings": 0,
                  "requirements": {
                    "total": 0,
                    "draft": 0,
                    "approved": 0,
                    "implemented": 0,
                    "verified": 0,
                    "waived": 0,
                    "other": 0
                  }
                },
                "findings": [],
                "mission": "Coffee in the office without anyone looking after the machine.",
                "ranking": [
                  {
                    "id": "O1",
                    "state": "item",
                    "set": "coffee",
                    "title": "No Dry Brews",
                    "file": "requirements/mission.shall.yaml"
                  }
                ],
                "items": [
                  {
                    "id": "O1",
                    "kind": "objective",
                    "title": "No Dry Brews",
                    "text": "No brew starts while the water tank is empty.",
                    "file": "requirements/mission.shall.yaml",
                    "line": 5,
                    "measure": "brews started on an empty tank, per thousand brews.",
                    "rank": 1,
                    "namedBy": [
                      {
                        "field": "serves",
                        "id": "N2.1",
                        "state": "item",
                        "set": "coffee",
                        "title": "Know Before Brewing",
                        "file": "requirements/mission.shall.yaml"
                      }
                    ]
                  },
                  {
                    "id": "S2",
                    "kind": "stakeholder",
                    "title": "Office User",
                    "text": "Wants coffee without having to look after the machine.",
                    "file": "requirements/mission.shall.yaml",
                    "line": 9,
                    "children": [
                      {
                        "id": "N2.1",
                        "kind": "need",
                        "title": "Know Before Brewing",
                        "text": "Know before I brew that the tank needs water.",
                        "file": "requirements/mission.shall.yaml",
                        "line": 13,
                        "status": "validated",
                        "serves": [
                          {
                            "id": "O1",
                            "state": "item",
                            "set": "coffee",
                            "title": "No Dry Brews",
                            "file": "requirements/mission.shall.yaml"
                          }
                        ],
                        "notes": [
                          "Heard from three users in the first week of the trial."
                        ],
                        "namedBy": [
                          {
                            "field": "serves",
                            "id": "R3.1",
                            "state": "item",
                            "set": "coffee",
                            "title": "Refill Lamp",
                            "file": "requirements/01-tank.shall.yaml"
                          }
                        ]
