---
title: Design
items:
  - id: T69
    title: How The shall Tool Is Built
    text: |
      `shall` is one Go binary [R19], and its commands share one way of reading a set:

      1. `internal/set` finds each manifest under the directory, and the files of
         its set.
      2. `internal/tree` reads each file's YAML with goccy/go-yaml, keeping the line
         of every value [R20].
      3. `internal/schema` checks each file's shape against the format's JSON
         Schema [R21].
      4. `internal/model` turns the files into items, with their ids, paths,
         references and citations; a topic's Markdown is read by goldmark [R43].
      5. `internal/rules` checks the format's rules within the set, and
         `internal/check` gathers every finding of the set.

      The commands build on that reading:

      - `shall check` prints the findings [T64].
      - `shall diff` reads the files of each ref from git's object store [R41],
        reads each side as above, and compares them item by item, with git
        finding the words that changed [R42].
      - `shall serve` keeps a snapshot of every set, read again when a file changes
        [R32.2], and answers the page and scripts in JSON [R31]. It draws DOT
        diagrams with Graphviz inside the binary [R59], started only to draw one
        [R59.2]; the page draws Mermaid's [R44].
      - `shall export` writes the server's answers and its page as files [T68].

      ```dot
      digraph shall {
        rankdir=LR
        node [shape=box]
        files [label="a set's files", shape=folder]
        git [label="a git ref", shape=folder]
        read [label="set, tree, schema,\nmodel, rules"]
        check [label="shall check"]
        diff [label="shall diff"]
        serve [label="shall serve"]
        export [label="shall export"]
        page [label="the page", shape=note]
        site [label="static files", shape=folder]
        files -> read
        git -> read [label="object store"]
        read -> check [label="findings"]
        read -> diff [label="two refs"]
        read -> serve [label="snapshot"]
        serve -> page [label="JSON"]
        read -> export
        export -> site [label="JSON and the page"]
      }
      ```
  - id: R19
    title: A Single Go Binary
    text: The tool SHALL be one binary, written in Go, that runs with nothing else installed but
      git, which diff asks for the files at a ref and for the words that changed.
    rationale: Adopters in a department of embedded engineers then need no runtime, and the same
      binary serves developers, pre-commit and CI. TypeScript was not taken because every machine
      would need Node.js, which refuses to run TypeScript inside node_modules, and npm is
      blocking the build-on-install that a hook installed from git would rely on. Rust was not
      taken for its weaker YAML libraries and slower builds.
    serves: [N52.4]
    verify: inspection
    status: implemented
    children:
      - id: R19.1
        title: Installed With Go
        text: The tool SHALL install with go install from a checkout of its repository.
        rationale: pre-commit builds a golang hook this way inside its clone of the repository,
          fetching Go when the machine has none.
        serves: [R6]
        status: implemented
      - id: R19.2
        title: A Module Named shall
        text: The tool's Go module SHALL be named shall, with no host in its name.
        rationale: The code then reads the same wherever the repository is hosted. Naming the
          module after its repository's address was not taken; it would let go install fetch a
          release by that address, which pre-commit and release binaries make unnecessary.
        serves: [N57.2]
        verify: inspection
        status: implemented
  - id: R20
    title: YAML Read With Positions
    text: The tool SHALL read YAML through the goccy/go-yaml package.
    rationale: It is maintained, and its syntax tree keeps the position of every token, which
      gives each finding its line. go-yaml v3 was not taken because it is frozen, and v4 because
      it is still a release candidate.
    serves: [R3, N55.1]
    verify: inspection
    status: implemented
    children:
      - id: R20.1
        title: One Canonical Layout
        text: The tool SHALL write each file it changes in one canonical layout, through a printer
          of its own.
        rationale: Edits then show in a diff as the change and nothing else, whatever layout a
          library would have chosen, and the files a set holds stay alike. The files use a small
          part of YAML, which a short printer covers.
        serves: [N52.1, N55.1]
        status: approved
  - id: R21
    title: Own Schema Validator
    text: The tool SHALL check the shape of each file against the format's JSON Schema with a
      validator of its own.
    rationale: The schema uses a small subset of JSON Schema, which a short interpreter covers
      without a dependency, and an own validator reports each error on the YAML node it concerns,
      in the format's terms. A JSON Schema library was not taken, to keep the supply chain small.
    serves: [R2, R3]
    status: implemented
    children:
      - id: R21.1
        title: Only The Supported Keywords
        text: If the schema uses a keyword the validator does not implement, then the validator
          SHALL refuse the schema.
        rationale: Editors validate the same schema with their own engines, and a keyword the
          validator skipped would let the two disagree unnoticed.
        status: implemented
  - id: R22
    title: Standard Testing Package
    text: The tool's tests SHALL use the testing package of Go's standard library.
    rationale: It needs no dependency, and go test writes machine-readable results with its json
      flag, which evidence tooling can read.
    serves: [R19]
    verify: inspection
    status: implemented
    children:
      - id: R22.1
        title: Tests Name What They Verify
        text: The tool's tests SHALL name each requirement they verify with a verifies attribute,
          one t.Attr call per requirement.
        rationale: go test with its json flag then reports each named requirement beside the
          result of the test that verifies it, so evidence tooling reads the link instead of
          parsing test names.
        serves: [N54.1]
        status: implemented
  - id: R58
    title: Tested On Every Change
    text: The repository SHALL run every test on each push and pull request, and fail the run
      when a test is skipped.
    rationale: A change that breaks a promise a test verifies is then found before it is merged.
      The tests skip what a machine lacks, Chrome or pre-commit, and a skipped test would
      otherwise pass for one that holds.
    serves: [R22]
    verify: inspection
    status: implemented
  - id: R61
    title: Its Own Set Published
    text: The repository SHALL publish a static copy of its own set on GitHub Pages on each push
      to its main branch, and link to it from its README.
    rationale: A reader then sees what the tool shows, on its own requirements as they stand on
      main, before installing anything.
    serves: [R60]
    verify: inspection
    status: implemented
  - id: R23
    title: Standard Flag Parsing
    text: The tool SHALL parse its command line with the flag package of Go's standard library.
    rationale: One flag set per command covers a directory argument and a few options without a
      dependency. Cobra was not taken; its generated help and command trees pay off only for a
      command line far larger than this one.
    serves: [N55.1]
    verify: inspection
    status: implemented
  - id: R24
    title: Common Go Style
    text: The tool's source SHALL follow the Google Go Style Guide.
    rationale: Contributors and agents expect the language's common conventions rather than a
      house style they must first learn.
    serves: [N57.2]
    verify: inspection
    status: implemented
    links:
      - url: https://google.github.io/styleguide/go/
        title: Google Go Style Guide
    children:
      - id: R24.1
        title: Formatted By gofmt
        text: The tool's source SHALL be formatted as gofmt formats it.
        status: implemented
      - id: R24.2
        title: Clean Under go vet
        text: The tool's source SHALL pass go vet without findings.
        status: implemented
  - id: R31
    title: JSON To A Thin Page
    text: The server SHALL send a set's content to its pages only as JSON, which the page's
      JavaScript turns into the document.
    rationale: Scripts, agents and the page then read one API, and every decision about a set
      stays in Go, beside the checker's code and tests. Building the pages as HTML with
      html/template was the first design, dropped because its answers served only a browser. A
      TypeScript application was not taken because it would bring Node.js back into
      development and add a build.
    serves: [R19, R36]
    verify: inspection
    status: implemented
    children:
      - id: R31.1
        title: Thin Pages
        text: The page's JavaScript SHALL decide nothing about a set's content, except which
          requirements the status filter shows and, in a static copy, what a search finds.
        rationale: The script fetches JSON, builds the document from it and keeps the view; ids,
          statuses, backlinks and the place of each finding come worked out from the server.
          The filter only chooses among the effective statuses the server sends, so a copy
          filters as the server's page does. A copy has no server to search, so its page
          searches as the server does, and a test holds the two to the same answers. htmx was
          not taken because it swaps in HTML that the server renders, which this API does not
          send.
        status: implemented
      - id: R31.2
        title: Script As Written
        text: The page's JavaScript SHALL be served as written, with no build step and no library
          but Mermaid, which draws diagrams.
        status: implemented
      - id: R31.3
        title: Text Stays Text
        text: The page's JavaScript SHALL put the text of a set into the page as text, never as
          markup, except the drawings of its diagrams, Mermaid's and the server's of DOT.
        rationale: Nothing a file of a set holds can then add markup or script to the page. A
          drawing is markup Mermaid makes itself, at the level [R44.1] sets, or that the server
          cleans before it sends it, as [R59.1] says.
        serves: [R7]
        status: implemented
  - id: R32
    title: Changes Polled And Pushed
    text: The server SHALL tell open pages about changed files over server-sent events.
    rationale: Server-sent events come with Go's standard library and every browser. WebSockets
      were not taken because the page never needs to talk back.
    serves: [R29]
    verify: inspection
    status: implemented
    children:
      - id: R32.1
        title: Hidden Pages Let Go
        text: While a page is hidden, the page's JavaScript SHALL keep its stream of changes
          closed, catching up when the page is shown again.
        rationale: Only the pages a reader can see then hold a connection, which keeps them under
          the browser's limit. One stream shared across tabs through a shared worker was not taken
          for the code it adds to the page.
        serves: [R29.1]
        status: implemented
      - id: R32.2
        title: Polled Once A Second
        text: The server SHALL look for changed files about once a second, comparing each file's
          modification time and size, and the contents of any file modified in the last two
          seconds.
        rationale: A walk per second costs little even for thousands of files. Comparing contents
          catches a save that keeps a file's size within one second, on file systems that record
          times only to the second. fsnotify was not taken for being a dependency with platform
          quirks, such as editors that save by replacing a file.
        status: implemented
      - id: R32.3
        title: Files That Come And Go
        text: The server SHALL count a set's file or a manifest that appears or vanishes under
          the served directory as a change.
        status: implemented
  - id: R35
    title: Pure.css
    text: The server SHALL style its pages with Pure.css, embedded in the binary as released,
      and a stylesheet of its own on top.
    rationale: Pure.css is a set of small, maintained CSS modules, 3.6 KB compressed, whose
      menus give the outline its shape and which brings no colour scheme of its own. Pico was
      not taken because it is no longer maintained; concrete.css, Simple.css and Water.css
      because they style bare elements for a single column of prose, which the document's own
      layout would override.
    serves: [R31]
    verify: inspection
    status: implemented
    links:
      - url: https://github.com/pure-css/pure
        title: Pure.css
    children:
      - id: R35.1
        title: Few Colours
        text: The server's own stylesheet SHALL colour links purple, errors red and warnings
          amber, and the rest black, white or grey.
        rationale: Amber tells a warning from an error at a glance, and stays readable on
          white as on black; the words error and warning still say it without colour.
        status: implemented
      - id: R35.2
        title: Licence Shipped
        text: The server SHALL serve Pure.css's licence beside it.
        rationale: The BSD licence asks that copies in binary form reproduce its notice.
        verify: test
        status: implemented
  - id: R41
    title: Refs Read Through Git
    text: The tool SHALL read the files of a ref from git's object store, through git, and check
      them as it checks the files on disk.
    rationale: Every machine that holds a set in git has git, and its object store gives the
      files exactly as committed, where an archive leaves out or rewrites those its attributes
      name. go-git was not taken for being a large dependency; reading the object store with
      code of the tool's own for being a large piece of code.
    serves: [R37]
    status: implemented
  - id: R42
    title: Words Compared By Git
    text: The tool SHALL find the changed words of a text with git's diff.
    rationale: Git compares words in linear memory and is installed wherever a ref is read. A
      diff library would be a dependency, and a comparison of the tool's own took memory that
      grew with the square of a text.
    serves: [R40.1]
    verify: inspection
    status: implemented
  - id: R43
    title: Markdown Read With goldmark
    text: The server SHALL read a topic's Markdown with goldmark and send it to the page as
      blocks of text.
    rationale: goldmark reads Markdown as CommonMark does, with GitHub's tables, and needs no
      library of its own, so a topic reads on the page as it previews in an editor; a parser of
      the tool's own would differ from those previews wherever it fell short. Blocks rather
      than HTML keep the page building text as text.
    serves: [R26.16, R31]
    verify: inspection
    status: implemented
    links:
      - url: https://github.com/yuin/goldmark
        title: goldmark
  - id: R44
    title: Diagrams Drawn By Mermaid
    text: The page SHALL draw each diagram of a topic with Mermaid, embedded in the binary as
      released.
    rationale: Mermaid draws state machines, sequences of messages and flowcharts from text that
      diffs and reviews like the rest of a set, and GitHub and GitLab draw it in Markdown. D2
      was not taken for being a large dependency few viewers know. The graphs Mermaid lays out
      poorly are drawn by Graphviz on the server [R59].
    serves: [R26.16]
    verify: inspection
    status: implemented
    links:
      - url: https://mermaid.js.org/
        title: Mermaid
    children:
      - id: R44.1
        title: Strict Mode
        text: The page SHALL run Mermaid at its strict security level.
        rationale: Mermaid then cleans a diagram's labels of markup and runs no script in them,
          so a diagram cannot add script to the page.
        serves: [R7]
        status: implemented
      - id: R44.2
        title: Licence Shipped
        text: The server SHALL serve Mermaid's licence beside it.
        rationale: The MIT licence asks that every copy include its notice.
        status: implemented
      - id: R44.3
        title: Styles Inline, Everything Else Its Own
        text: The server SHALL let its pages apply inline styles, and take scripts, images, fonts
          and connections only from the server itself.
        rationale: Mermaid styles its drawings inline. A style a diagram slipped in can then load
          or send nothing beyond the server, and a script it slipped in does not run. Drawing each
          diagram as an image instead was not taken because Mermaid still measures it in the page,
          and the image needs sizing of its own.
        serves: [R7]
        status: implemented
  - id: R59
    title: DOT Drawn By Graphviz
    text: The server SHALL draw each DOT diagram of a topic with Graphviz, run inside its
      binary, and send the drawing as SVG.
    rationale: Graphviz lays out graphs Mermaid cannot, such as consumption left to right with
      a node's children hanging below it in one column. Run inside the binary, through
      goccy/go-graphviz, it needs no WebAssembly in the page, whose policy then stays as it is.
      Graphviz in the page was not taken for needing that policy loosened; Viz.js's build in
      plain JavaScript for being frozen since 2018; ELK, a layout engine in JavaScript, for not
      being Graphviz, so that DOT's meaning would have to be built anew.
    serves: [R26.16]
    status: implemented
    links:
      - url: https://github.com/goccy/go-graphviz
        title: go-graphviz
      - url: https://graphviz.org/
        title: Graphviz
    children:
      - id: R59.1
        title: Drawings Cleaned
        text: The server SHALL send of a drawing only its shapes, text and styles, without
          scripts, links, images or anything that loads from elsewhere.
        rationale: A DOT diagram can give a node a link or an image; the drawing the page puts
          in then holds neither.
        serves: [R7]
        status: implemented
      - id: R59.2
        title: Graphviz Started Only To Draw
        text: The tool SHALL start Graphviz only to draw a diagram, and keep its compiled code in
          memory.
        rationale: A command that draws nothing, such as a check on every commit, then pays
          nothing for Graphviz, and the tool writes no code where another user of the machine
          could replace it. go-graphviz as released compiles Graphviz whenever a program that
          links it starts, and keeps the compiled code in a directory under the temporary
          directory that any user can write to, loading it back unchecked; the tool builds a copy
          changed to do neither, kept in third_party/go-graphviz. Drawing then costs about half
          a second, once per run.
        serves: [N62.1]
        status: implemented
