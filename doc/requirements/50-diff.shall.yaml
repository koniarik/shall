---
title: Diff
items:
  - id: T65
    title: What A Diff Reports
    text: |
      `shall diff` compares the sets under a directory as they stand at two git
      refs, item by item, and prints what changed for people or, with `-json`, for
      scripts. What it reads [R37], what counts as a change [R38] and what it
      reports of a change [R39], [R40] are requirements below.

      The examples compare the fuller example set [T63.14] with a working tree in
      which R3.1.1 is reworded and back to draft, and a chapter adds R5.
    children:
      - id: T65.1
        title: As Text
        text: |
          ```text
          shall.yaml: set coffee
            requirements/01-tank.shall.yaml
              R3.1 Refill Lamp: changed
                effective status: [-implemented-]{+draft+}
              R3.1.1 Lamp Seen From The Door: changed
                text: … refill lamp to anyone [-standing at-]{+entering+} the [-kitchen door.-]{+kitchen.+}
                status: [-implemented-]{+draft+}
            requirements/02-brew.shall.yaml: chapter added
              R5 No Brew On An Empty Tank: added
          2 items changed, 1 added, 0 removed, 0 retired, 0 moved
          ```

          Each set comes with its set-wide fields, then its files in path order,
          each with its items in reading order and the items gone last, then the
          checker's findings new at the head and gone from it. [R40.1] says how a
          changed value is marked.
      - id: T65.2
        title: As JSON
        text: |
          - What is empty or absent is left out, except `sets`, which is `[]` when
            nothing changed.
          - Values are as written: a text is a string, a list an array and a map an
            object. A field written `null`, or with nothing after its colon, is
            `null`; a field one side lacks has no `old` or no `new`.
          - Paths are relative to the directory compared.

          | Key | Meaning |
          |---|---|
          | `base`, `head` | The refs compared; an empty `head` is the working tree |
          | `sets` | The sets that differ, in manifest path order |
          | `totals` | How many items were `changed`, `added`, `removed`, `retired` and `moved`; a moved item also counts as what else happened to it |

          A set carries:

          | Key | Meaning |
          |---|---|
          | `manifest` | The path of its manifest, which matches it between the refs |
          | `name` | The name its manifest gives it |
          | `change` | `added`, `removed` or `changed` |
          | `fields` | Its set-wide fields that differ, those [R39.2] names |
          | `files` | Its chapters added, removed or retitled, the mission file among them |
          | `items` | Its items that differ |
          | `findings` | The checker's findings `new` at the head and those `gone`, each as `shall check` reports it, matched while ignoring their lines |

          A field carries `field`, its name, with its `old` and `new` value.

          A file carries `path`; `mission`, true for the mission file; `change`,
          which is `added`, `removed` or `retitled`; and `title`, with its `old` and
          `new` title.

          An item carries:

          | Key | Meaning |
          |---|---|
          | `id`, `title` | The item's id and title, at the head, or at the base for an item gone |
          | `file` | The file holding it, at the head, or at the base for an item gone |
          | `change` | `added`, `removed`, `retired` or `changed` |
          | `movedFrom` | The file that held it at the base, when another |
          | `fields` | The fields it writes whose values differ, without its children and retired ids, which are items of their own |
          | `effectiveStatus` | A requirement's `old` and `new` effective status, where [R38.2] reports it |

          ```json
          {
            "base": "HEAD",
            "head": "",
            "sets": [
              {
                "manifest": "shall.yaml",
                "name": "coffee",
                "change": "changed",
                "files": [
                  {
                    "path": "requirements/02-brew.shall.yaml",
                    "change": "added",
                    "title": {
                      "new": "Brewing"
                    }
                  }
                ],
                "items": [
                  {
                    "id": "R3.1",
                    "title": "Refill Lamp",
                    "file": "requirements/01-tank.shall.yaml",
                    "change": "changed",
                    "effectiveStatus": {
                      "old": "implemented",
                      "new": "draft"
                    }
                  },
                  {
                    "id": "R3.1.1",
                    "title": "Lamp Seen From The Door",
                    "file": "requirements/01-tank.shall.yaml",
                    "change": "changed",
                    "fields": [
                      {
                        "field": "text",
                        "old": "The machine SHALL show the refill lamp to anyone standing at the kitchen door.",
                        "new": "The machine SHALL show the refill lamp to anyone entering the kitchen."
                      },
                      {
                        "field": "status",
                        "old": "implemented",
                        "new": "draft"
                      }
                    ]
                  },
                  {
                    "id": "R5",
                    "title": "No Brew On An Empty Tank",
                    "file": "requirements/02-brew.shall.yaml",
                    "change": "added"
                  }
                ]
              }
            ],
            "totals": {
              "changed": 2,
              "added": 1,
              "removed": 0,
              "retired": 0,
              "moved": 0
            }
          }
          ```
  - id: R37
    title: Sets Compared Between Refs
    text: When asked to diff, the tool SHALL compare every set under the given directory, the
      current one by default, as it stands at two git refs.
    rationale: A reviewer judges a change by what it does to the statements, not by the lines
      of YAML it touches.
    serves: [N53.1, N55.1]
    status: implemented
    children:
      - id: R37.1
        title: Base And Head From The Command Line
        text: The tool SHALL take the two refs from its command line, the base defaulting to
          HEAD and the head to the working tree.
        rationale: A plain diff then shows the changes not yet committed, as git diff does, and
          two refs compare without touching the working tree.
        status: implemented
      - id: R37.2
        title: The Working Tree As It Stands
        text: Where the head is the working tree, the tool SHALL read the files as they stand on
          disk, those git does not track included.
        rationale: A new chapter is part of the change before anyone adds it to git.
        status: implemented
      - id: R37.3
        title: The Same Place In Each Ref
        text: The tool SHALL read the given directory at the same place in the repository in
          each ref, together with the set files its manifests lead to elsewhere in the
          repository.
        rationale: A set kept in a submodule reads at a ref from the commit the ref records for it
          [R72], and nothing outside the repository is read [R73].
        status: implemented
        retired:
          - id: R37.3.1
            title: Nothing Read From Outside The Repository
          - id: R37.3.2
            title: Submodules As Their Files
      - id: R37.4
        title: When Git Cannot Answer
        text: If git cannot give a ref, then the tool SHALL say why and exit with status 2.
        status: implemented
      - id: R37.5
        title: Changed Or Not In The Exit Status
        text: The tool SHALL exit with status 0 when nothing changed between the refs, and 1 when
          something did.
        rationale: Scripts then tell a change from no change as they do with diff.
        status: implemented
      - id: R37.6
        title: No Set To Compare
        text: If neither ref holds a set under the given directory, then the tool SHALL say so
          and exit with status 2.
        rationale: A diff of a directory holding only chapters, their manifest above it, would
          otherwise say that nothing changed.
        status: implemented
      - id: R37.7
        title: Whitespace Is No Change
        text: The tool SHALL NOT report a value that differs between the refs only in its
          whitespace, unless it is a topic's text whose Markdown then reads as other blocks.
        rationale: A text rewrapped says what it said. In Markdown, whitespace is also structure,
          as a blank line divides paragraphs and a line break separates list items.
        status: implemented
  - id: R38
    title: Items Compared By Id
    text: The tool SHALL match items between the refs by their id, and report each item added,
      removed, retired or changed.
    rationale: Ids stay with their statement wherever it moves, so they show what happened to
      it.
    serves: [N53.1]
    status: implemented
    children:
      - id: R38.1
        title: Fields As Written
        text: The tool SHALL report each field an item writes whose value differs between the
          refs, with its old and new value.
        rationale: An inherited value changes with the parent's field, where it is reported.
        status: implemented
      - id: R38.2
        title: Effective Status
        text: When a requirement's effective status [T63.10] differs between the refs and its own
          status does not tell the change, the tool SHALL report the effective status.
        rationale: A child going back to draft lowers its parent, which a reviewer wants to see
          on the parent. Where the requirement's own status tells the change, a second line
          would say it again.
        status: implemented
      - id: R38.3
        title: Moved Between Chapters
        text: When an item's file differs between the refs, the tool SHALL report the file it
          moved from.
        status: implemented
      - id: R38.4
        title: Order Is No Change
        text: The tool SHALL NOT report an item that only moved within its chapter.
        rationale: The statement is the same wherever it stands in the chapter.
        status: implemented
  - id: R39
    title: Sets, Chapters And Findings Compared
    text: The tool SHALL report the sets, chapters and set-wide fields that differ between the
      refs.
    serves: [N53.1]
    status: implemented
    children:
      - id: R39.1
        title: Sets By Manifest
        text: The tool SHALL match sets between the refs by the path of their manifest.
        rationale: A set renamed in its manifest is then a change of name, not a set gone and
          another come.
        status: implemented
      - id: R39.2
        title: Set-Wide Fields
        text: The tool SHALL report each change to a set's mission statement, its ranking, and
          its manifest's name, path and depends.
        rationale: A changed rev under depends is a set depended on, upgraded.
        status: implemented
      - id: R39.3
        title: Chapters And The Mission File
        text: The tool SHALL report each chapter added, removed or retitled, naming the mission
          file as such.
        status: implemented
      - id: R39.4
        title: Findings Gained And Lost
        text: The tool SHALL report the checker's findings that are new at the head and those
          that are gone.
        rationale: A reviewer then sees what a change breaks or mends without checking both
          sides.
        status: implemented
  - id: R40
    title: A Diff To Read
    text: The tool SHALL report a diff as text, grouped by set and then by file, with its totals
      last.
    serves: [N53.1]
    status: implemented
    children:
      - id: R40.1
        title: Changed Words Marked
        text: The tool SHALL show a changed text by its changed part, the removed words marked
          [-like this-] and the added ones {+like this+}.
        rationale: The marks read without colour and paste into a review, as git diff's word
          diff does.
        status: implemented
        children:
          - id: R40.1.1
            title: Whitespace Marked
            text: When a topic's text changes only in its whitespace, the tool SHALL show the
              whitespace that changed, a line break as ↵ and any other space as ·.
            rationale: The words alone would then show nothing changed.
            status: implemented
      - id: R40.2
        title: A Diff For Scripts
        text: Where JSON output is requested, the tool SHALL print the diff as one JSON document
          holding all the text does, with each changed value whole.
        serves: [N55.1]
        status: implemented
